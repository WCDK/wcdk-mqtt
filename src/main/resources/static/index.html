<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wcdk-MQTT 控制台</title>
    <link rel="stylesheet" href="/vendor/element-ui/theme-chalk/index.css">
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #303133;
        }

        [v-cloak] {
            display: none;
        }

        .layout {
            min-height: 100vh;
        }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #ffffff;
            border-bottom: 1px solid #e4e7ed;
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .topbar-title h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        .topbar-meta {
            color: #909399;
            font-size: 13px;
            white-space: nowrap;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content {
            padding: 16px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric-card {
            background: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 14px 16px;
            min-height: 96px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .metric-label {
            color: #909399;
            font-size: 13px;
            line-height: 1.4;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.1;
            color: #303133;
        }

        .metric-foot {
            color: #606266;
            font-size: 12px;
            line-height: 1.4;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid #ebeef5;
        }

        .panel-title {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .panel-body {
            padding: 16px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .compact-form .el-form-item {
            margin-bottom: 14px;
        }

        .status-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .subscription-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .empty-note {
            color: #909399;
            font-size: 13px;
        }

        .message-payload {
            max-width: 100%;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .table-pagination {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .section-grid {
            display: grid;
            grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }

        .mono {
            font-family: Consolas, "SFMono-Regular", monospace;
        }

        @media (max-width: 1100px) {
            .section-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .topbar {
                height: auto;
                padding: 12px 16px;
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .topbar-title {
                width: 100%;
                flex-wrap: wrap;
            }

            .topbar-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .content {
                padding: 12px;
            }

            .metric-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
        }
    </style>
</head>
<body>
<div id="app" class="layout" v-cloak>
    <app-header
            :overview="overview"
            :broker-address="brokerAddress"
            :settings="settings"
            :loading="loading"
            :active-panel="activePanel"
            @refresh="refreshAll"
            @toggle-panel="togglePanel">
    </app-header>

    <main class="content">
        <template v-if="activePanel === 'main'">
            <metric-cards :overview="overview"></metric-cards>

            <section class="section-grid">
                <div>
                    <publish-panel
                            :form="publishForm"
                            :loading="loading.publish"
                            @submit="publishMessage">
                    </publish-panel>

                    <subscriptions-panel
                            :subscriptions="subscriptions"
                            :loading="loading.subscriptions"
                            :subscription-input-state="subscriptionInputState"
                            @submit="addSubscription"
                            @remove="removeSubscription">
                    </subscriptions-panel>

                    <broker-config-panel :overview="overview"></broker-config-panel>
                </div>

                <div>
                    <clients-panel
                            :clients="filteredClients"
                            :loading="loading.clients"
                            :client-filters="clientFilters">
                    </clients-panel>

                    <messages-panel
                            :messages="messages"
                            :loading="loading"
                            :filters="messageFilters"
                            :page-no="messagePagination.pageNo"
                            :page-size="messagePagination.pageSize"
                            :total="messagePagination.total"
                            @search="reloadMessages"
                            @clear="clearMessages"
                            @delete-selected="deleteSelectedMessages"
                            @delete-by-filter="deleteMessagesByFilter"
                            @delete-all="deleteAllMessages"
                            @page-change="handleMessagePageChange"
                            @page-size-change="handleMessagePageSizeChange">
                    </messages-panel>
                </div>
            </section>
        </template>

        <template v-if="activePanel === 'cluster'">
            <cluster-panel
                    :cluster-nodes="clusterNodes"
                    :cluster-config="clusterConfig"
                    :cluster-stats="clusterStats"
                    :loading="loading.cluster">
            </cluster-panel>
        </template>
    </main>
</div>

<script src="/vendor/vue/vue.min.js"></script>
<script src="/vendor/element-ui/index.js"></script>
<script src="/js/components/app-header.js"></script>
<script src="/js/components/metric-cards.js"></script>
<script src="/js/components/publish-panel.js"></script>
<script src="/js/components/subscriptions-panel.js"></script>
<script src="/js/components/broker-config-panel.js"></script>
<script src="/js/components/clients-panel.js"></script>
<script src="/js/components/messages-panel.js"></script>
<script src="/js/components/cluster-panel.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
