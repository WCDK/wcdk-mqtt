server:
  port: ${SERVER_PORT:38082}
  servlet:
    encoding:
      charset: ${SERVER_CHARSET:UTF-8}
      enabled: true
      force: true

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcRepositoriesAutoConfiguration
  main:
    banner-mode: off
    web-application-type: reactive
  application:
    name: ${SPRING_APPLICATION_NAME:wcdk-mqtt-service}
knife4j:
  enable: ${KNIFE4J_ENABLE:true}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

wcdk:
  swagger:
    title: ${WCDK_SWAGGER_TITLE:wcdk-mqtt-service 接口文档}
    description: ${WCDK_SWAGGER_DESCRIPTION:wcdk-mqtt-service MQTT 服务接口文档}
    version: ${WCDK_SWAGGER_VERSION:1.0}
  r2dbc:
    enabled: ${WCDK_R2DBC_ENABLED:false}
  mqtt:
    broker:
      enabled: ${MQTT_BROKER_ENABLED:true}
      boss-threads: ${MQTT_BOSS_THREADS:1}
      worker-threads: ${MQTT_WORKER_THREADS:0}
      backlog: ${MQTT_BACKLOG:1024}
      host: ${MQTT_BROKER_ADVERTISE_HOST:0.0.0.0}
      port: ${MQTT_BROKER_PORT:1883}
      max-payload-size: ${MQTT_MAX_PAYLOAD_SIZE:1048576}
      max-client-id-length: ${MQTT_MAX_CLIENT_ID_LENGTH:128}
      anonymous: ${MQTT_ANONYMOUS:true}
      username: ${MQTT_USERNAME:admin}
      password: ${MQTT_PASSWORD:wcdk@2026}
      retained-messages: ${MQTT_RETAINED_MESSAGES:true}
      persistence: ${MQTT_PERSISTENCE:true}
      delivery-ack-enabled: ${MQTT_DELIVERY_ACK_ENABLED:true}
      client-ack-enabled: ${MQTT_CLIENT_ACK_ENABLED:true}
      cluster:
        enabled: ${MQTT_CLUSTER_ENABLED:true}
        heartbeat-interval-millis: ${MQTT_CLUSTER_HEARTBEAT_INTERVAL:1000}
        node-timeout-millis: ${MQTT_CLUSTER_NODE_TIMEOUT:10000}
        node-id: ${MQTT_CLUSTER_NODE_ID:}
        role: ${MQTT_CLUSTER_ROLE:MASTER}
        master: ${MQTT_CLUSTER_MASTER:}
        channel: ${MQTT_CLUSTER_CHANNEL:tcp}
        bind-host: ${MQTT_CLUSTER_BIND_HOST:0.0.0.0}
        bind-port: ${MQTT_CLUSTER_BIND_PORT:28883}
        global-session: ${MQTT_CLUSTER_GLOBAL_SESSION:false}
        load-balance:
          enabled: ${MQTT_CLUSTER_LOAD_BALANCE_ENABLED:true}
          include-master: ${MQTT_CLUSTER_LOAD_BALANCE_INCLUDE_MASTER:false}
        username: ${MQTT_CLUSTER_USERNAME:admin}
        password: ${MQTT_CLUSTER_PASSWORD:wcdk@2026}
        peers:
          - ${MQTT_CLUSTER_PEERS:127.0.0.1:28884}
        delivery-ack-enabled: ${MQTT_CLUSTER_DELIVERY_ACK_ENABLED:true}
        client-ack-enabled: ${MQTT_CLUSTER_CLIENT_ACK_ENABLED:true}
      acl:
        enabled: ${MQTT_ACL_ENABLED:false}
        default-policy: ${MQTT_ACL_DEFAULT_POLICY:ALLOW}
        rules:
          - enabled: true
            policy: DENY
            action: PUBLISH
            client-ids:
              - blocked-*
            topic-filters:
              - wcdk/secure/#
  influx:
    enabled: ${INFLUX_ENABLED:true}
    url: ${INFLUX_URL:http://172.21.32.1:8086}
    token: ${INFLUX_TOKEN:}
    org: ${INFLUX_ORG:wcdk}
    bucket: ${INFLUX_BUCKET:wcdk-messages}
    username: ${INFLUX_USERNAME:admin}
    password: ${INFLUX_PASSWORD:wcdk@2026}
    timeout-seconds: ${INFLUX_TIMEOUT_SECONDS:120}
    batch-size: ${INFLUX_BATCH_SIZE:500}
    flush-interval-ms: ${INFLUX_FLUSH_INTERVAL_MS:1000}
    max-retries: ${INFLUX_MAX_RETRIES:1}
    query-range: ${INFLUX_QUERY_RANGE:-7d}
logging:
  charset:
    console: ${LOGGING_CHARSET_CONSOLE:UTF-8}
    file: ${LOGGING_CHARSET_FILE:UTF-8}
  level:
    com.wcdk.mqtt.core: ${LOGGING_LEVEL:INFO}
