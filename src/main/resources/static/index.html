<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT Broker 控制台</title>
<link rel="stylesheet" href="/css/console.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">MQTT</span>
    <span class="title">Broker 控制台</span>
  </div>
  <div class="topbar-right">
    <span class="live-state" id="liveState">实时连接中…</span>
    <span class="user" id="currentUser">—</span>
    <a class="logout" href="/logout">退出登录</a>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="overview">概览</button>
  <button class="tab" data-tab="clients">客户端</button>
  <button class="tab" data-tab="messages">消息</button>
  <button class="tab" data-tab="retained">保留消息</button>
  <button class="tab" data-tab="cluster">集群</button>
  <button class="tab" data-tab="publish">发布消息</button>
</nav>

<main>
  <!-- 概览 -->
  <section class="panel active" id="panel-overview">
    <div class="cards" id="overviewCards"></div>
    <div class="box">
      <div class="box-title">最近会话事件</div>
      <table class="table">
        <thead>
        <tr><th>时间</th><th>动作</th><th>客户端 ID</th><th>用户名</th><th>来源节点</th><th>远端地址</th></tr>
        </thead>
        <tbody id="sessionEvents"></tbody>
      </table>
    </div>
  </section>

  <!-- 客户端 -->
  <section class="panel" id="panel-clients">
    <div class="toolbar">
      <input type="text" id="clientKeyword" placeholder="按客户端 ID 或用户名搜索">
      <select id="clientOnline">
        <option value="">全部状态</option>
        <option value="true">仅在线</option>
        <option value="false">仅离线</option>
      </select>
      <button id="clientSearch">查询</button>
      <span class="tip">删除操作会强制断开连接，勾选「同时清除会话」将移除会话状态</span>
    </div>
    <div class="box">
      <table class="table">
        <thead>
        <tr>
          <th>客户端 ID</th><th>用户名</th><th>状态</th><th>来源</th><th>属主节点</th>
          <th>远端地址</th><th>KeepAlive</th><th>订阅数</th><th>离线队列</th><th>待确认</th><th>操作</th>
        </tr>
        </thead>
        <tbody id="clientRows"></tbody>
      </table>
    </div>
    <div class="box" id="subscriptionBox" hidden>
      <div class="box-title">订阅明细：<span id="subscriptionOwner"></span></div>
      <table class="table">
        <thead><tr><th>主题过滤器</th><th>QoS</th></tr></thead>
        <tbody id="subscriptionRows"></tbody>
      </table>
    </div>
  </section>

  <!-- 消息 -->
  <section class="panel" id="panel-messages">
    <div class="toolbar">
      <input type="text" id="msgTopic" placeholder="主题过滤器，如 sensors/#">
      <select id="msgQos">
        <option value="">全部 QoS</option>
        <option value="0">QoS 0</option>
        <option value="1">QoS 1</option>
        <option value="2">QoS 2</option>
      </select>
      <button id="msgSearch">查询</button>
      <label class="check"><input type="checkbox" id="msgLive" checked>实时追加</label>
      <button class="danger" id="msgClear">清空</button>
    </div>
    <div class="box">
      <table class="table">
        <thead>
        <tr><th>时间</th><th>主题</th><th>QoS</th><th>保留</th><th>负载</th><th>命中订阅</th></tr>
        </thead>
        <tbody id="messageRows"></tbody>
      </table>
    </div>
  </section>

  <!-- 保留消息 -->
  <section class="panel" id="panel-retained">
    <div class="toolbar">
      <button id="retainedRefresh">刷新</button>
      <span class="tip">删除保留消息会向集群同步空负载消息</span>
    </div>
    <div class="box">
      <table class="table">
        <thead><tr><th>主题</th><th>QoS</th><th>负载</th><th>操作</th></tr></thead>
        <tbody id="retainedRows"></tbody>
      </table>
    </div>
  </section>

  <!-- 集群 -->
  <section class="panel" id="panel-cluster">
    <div class="cards" id="clusterCards"></div>
    <div class="box">
      <div class="box-title">对等节点</div>
      <table class="table">
        <thead>
        <tr><th>节点 ID</th><th>地址</th><th>状态</th><th>拨号方向</th><th>最后活跃</th></tr>
        </thead>
        <tbody id="clusterRows"></tbody>
      </table>
    </div>
    <div class="box">
      <div class="box-title">配置的对等地址</div>
      <div class="peer-list" id="configuredPeers"></div>
    </div>
  </section>

  <!-- 发布 -->
  <section class="panel" id="panel-publish">
    <div class="box narrow">
      <div class="box-title">发布消息</div>
      <div class="form-row">
        <label>主题 *</label>
        <input type="text" id="pubTopic" placeholder="如 sensors/temperature">
      </div>
      <div class="form-row">
        <label>负载</label>
        <textarea id="pubPayload" rows="5" placeholder="消息内容（文本）"></textarea>
      </div>
      <div class="form-row inline">
        <label>负载编码</label>
        <select id="pubEncoding">
          <option value="text">文本（UTF-8）</option>
          <option value="base64">Base64</option>
        </select>
        <label>QoS</label>
        <select id="pubQos">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
        <label class="check"><input type="checkbox" id="pubRetained">保留消息</label>
      </div>
      <div class="form-row">
        <label>目标客户端 ID（可选，点对点投递）</label>
        <input type="text" id="pubClientId" placeholder="留空则按主题路由">
      </div>
      <button id="pubSubmit">发 布</button>
      <div class="form-result" id="pubResult"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
