server:
  port: 38082
  shutdown: graceful

spring:
  application:
    name: wcdk-mqtt
  lifecycle:
    timeout-per-shutdown-phase: 10s

wcdk:
  mqtt:
    # MQTT 接入配置
    broker:
      enabled: true
      host: 0.0.0.0
      port: 1883
      max-payload-size: 1048576
      max-client-id-length: 128
      retained-messages: true
      offline-queue: true
      max-offline-messages: 1000
      retransmit-timeout-millis: 10000
      max-retransmit-attempts: 3
      sweep-interval-seconds: 5
      message-log-capacity: 500
    # 认证与控制台安全配置
    security:
      anonymous: true
      username:
      password:
      console-username: admin
      console-password: admin
    # 访问控制列表，默认关闭
    acl:
      enabled: false
      default-policy: allow
      rules: []
    # 集群配置：所有节点对等，无主从之分；单实例保持 enabled=false
    cluster:
      enabled: false
      node-id: node-1
      bind-host: 0.0.0.0
      bind-port: 28883
      advertise-host:
      peers: []
      username:
      password:
      heartbeat-interval-millis: 5000
      node-timeout-millis: 15000
      reconnect-delay-millis: 3000
    # 网页控制台
    console:
      enabled: true

logging:
  level:
    com.wcdk.mqtt: info
    reactor.netty: warn
    reactor.netty.channel: warn
