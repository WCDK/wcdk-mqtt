<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - MQTT Broker 控制台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  background: linear-gradient(135deg, #1e3a5f 0%, #0f2027 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: #ffffff;
  border-radius: 8px;
  padding: 40px 36px;
  width: 360px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}
.login-box h1 {
  font-size: 20px;
  color: #1e3a5f;
  text-align: center;
  margin-bottom: 6px;
}
.login-box .sub {
  text-align: center;
  color: #7a8699;
  font-size: 13px;
  margin-bottom: 26px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  color: #45516a;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  height: 40px;
  border: 1px solid #d4dae3;
  border-radius: 4px;
  padding: 0 12px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: #2f6fed; }
button {
  width: 100%;
  height: 42px;
  background: #2f6fed;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s;
}
button:hover { background: #1f5bd0; }
.error {
  color: #d93025;
  font-size: 13px;
  text-align: center;
  margin-bottom: 14px;
  min-height: 18px;
}
</style>
</head>
<body>
<div class="login-box">
  <h1>MQTT Broker 控制台</h1>
  <div class="sub">基于 Reactor 的响应式 MQTT 代理</div>
  <div class="error" id="error"></div>
  <form id="loginForm" method="post" action="/login">
    <div class="field">
      <label for="username">账号</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">登 录</button>
  </form>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  if (params.get('error') !== null) {
    document.getElementById('error').textContent = '账号或密码错误，请重新输入';
  }
  var logout = params.get('logout');
  if (logout !== null) {
    document.getElementById('error').textContent = '已安全退出登录';
    document.getElementById('error').style.color = '#188038';
  }
  // 登录成功后 Spring Security 默认跳回 /，此处统一引导到控制台首页
  if (window.location.pathname === '/login' && !params.toString()) {
    window.location.replace('/login.html');
  }
})();
</script>
</body>
</html>
